{% load static %}
<! DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Green Getaway{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'getaway/css/style.css' %}">
</head>
<body>

<!-- Hero section -->
<header class="hero d-flex align-items-center justify-content-center">
    <div class="hero-text text-center text-white">
        <h1 class="display-4 fw-bold">Welcome to Green Getaway</h1>
        <p class="lead">
            <br>
            <br>
            Choose your adventure:

        </p>
    </div>
</header>

<!-- Main content: category cards -->
<main class="container my-5">
    <div class="row justify-content-center g-4">
        {% for category in categories %}
        <div class="col-md-4 col-sm-6">
            <a href="#" class="text-decoration-none">
                <div class="card h-100 shadow-sm category-card">
                    <div class="card-img-container">
                        <img src="{% static category.image %}" class="card-img" alt="{{ category.name }}">
                        <div class="overlay"></div>
                        <h5 class="card-title">{{ category.name }}</h5>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
